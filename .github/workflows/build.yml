name: build

# Packaged apps for Windows (.exe), macOS (.app in a .dmg) and a generic Linux binary (.tar.gz; Arch users
# have packaging/PKGBUILD instead, see README). Runs only when asked: on a version tag
# (git tag v0.2.0 && git push --tags), which also publishes a GitHub release, or by hand from the Actions
# tab, which only keeps the files as downloadable artifacts. Never on ordinary pushes: in a private repo,
# Windows minutes count 2x and macOS minutes 10x against the monthly Actions allowance (moot now that the
# repo is public, where Actions minutes for standard runners are free, but still no reason to run this on
# every push).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job, below, may write (to create the release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: lapbar-qt-windows-x64
          - os: macos-latest             # Apple silicon
            name: lapbar-qt-macos-arm64
          - os: ubuntu-latest
            name: lapbar-qt-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      LAPBAR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      # PyQt6's wheel doesn't bundle these; without them even the offscreen platform plugin fails to load.
      - name: Qt's Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1

      - run: python -m pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller --noconfirm --clean packaging/lapbar-qt.spec

      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed .exe detaches from the console, so wait for it explicitly and check its exit code.
          $p = Start-Process -FilePath dist\lapbar-qt.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content lapbar-qt-selftest.log -ErrorAction SilentlyContinue; exit 1 }
          Compress-Archive -Path dist\lapbar-qt.exe -DestinationPath "${{ matrix.name }}.zip"

      - name: Self-test the built app and make a disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/lapbar-qt.app/Contents/MacOS/lapbar-qt --self-test || { cat lapbar-qt-selftest.log; exit 1; }
          hdiutil create -volname LapBar -srcfolder dist/lapbar-qt.app -ov -format UDZO "${{ matrix.name }}.dmg"

      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/lapbar-qt --self-test || { cat lapbar-qt-selftest.log; exit 1; }
          tar -C dist -czf "${{ matrix.name }}.tar.gz" lapbar-qt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*
          retention-days: 14             # artifacts count against the repo's Actions storage

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The tag goes in through the environment, never pasted into the script: a tag name can contain
      # shell syntax such as $(...).
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" lapbar-qt-* --repo "$REPO" --generate-notes

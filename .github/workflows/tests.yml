name: tests

# Pushes and pull requests: Linux only, oldest and newest Python (cheap: Linux minutes count 1x).
# Started by hand from the Actions tab: Windows and macOS as well. In a private repo those count 2x and 10x
# against the monthly Actions allowance, so they are not run on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt's system libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt pytest duckdb
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: App smoke tests (headless)
        run: python -m pytest -q app/tests
